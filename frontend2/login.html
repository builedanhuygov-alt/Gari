<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập • Gari AI Lab</title>
    <link rel="stylesheet" href="/static/frontend2/style.css">
    <script>
        try {
            var t = localStorage.getItem('gari-theme');
            if (t === 'dark') document.documentElement.dataset.theme = 'dark';
            else document.documentElement.dataset.theme = 'light';
        } catch(e) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 0%, rgba(22, 101, 52, 0.08) 0%, transparent 60%), var(--bg);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .auth-logo {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, #166534 0%, #15803D 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.3);
        }

        .auth-logo svg {
            width: 26px;
            height: 26px;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin: 0;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .auth-alert {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        .auth-alert.error {
            display: flex;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .auth-alert.success {
            display: flex;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .dev-badge-btn {
            background: var(--surface-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
        }

        .dev-badge-btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 18px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                    </svg>
                </div>
                <div>
                    <h1 class="auth-title">Đăng nhập Gari AI Lab</h1>
                    <p class="auth-subtitle">Nền tảng Quản lý Nông nghiệp & Chẩn đoán Bệnh cây bằng AI</p>
                </div>
            </div>

            <!-- Error / Info Notification -->
            <div id="authAlert" class="auth-alert"></div>

            <!-- Dev Quick Fill Button -->
            <div class="dev-badge-btn" id="btnDevAutofill" title="Điền nhanh tài khoản kiểm thử chính">
                <span>⚡ Tài khoản thử nghiệm (Kỹ sư Đan Huỳnh)</span>
                <span style="font-size:11px; opacity:0.8;">Tự động điền</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
                <div class="form-group" style="margin:0;">
                    <label class="form-label" for="loginEmail">Email đăng nhập *</label>
                    <input type="email" id="loginEmail" class="input" placeholder="danhuynh@gari.vn" required autocomplete="email" />
                </div>

                <div class="form-group" style="margin:0;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label class="form-label" for="loginPassword">Mật khẩu *</label>
                        <a href="/frontend2/forgot-password.html" style="font-size:12px; color:var(--primary); text-decoration:none; font-weight:500;">
                            Quên mật khẩu?
                        </a>
                    </div>
                    <div style="position:relative;">
                        <input type="password" id="loginPassword" class="input" placeholder="••••••••" required autocomplete="current-password" />
                        <button type="button" id="btnTogglePassword" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:12px; padding:4px;" title="Hiện / Ẩn mật khẩu">
                            Hiện
                        </button>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="rememberMe" style="accent-color:var(--primary); width:16px; height:16px; cursor:pointer;" />
                    <label for="rememberMe" style="font-size:12.5px; color:var(--text-secondary); cursor:pointer; user-select:none;">
                        Ghi nhớ phiên đăng nhập (30 ngày)
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSubmit" style="height:42px; font-size:14px; width:100%; margin-top:4px;">
                    Đăng nhập vào hệ thống
                </button>
            </form>

            <div class="auth-footer">
                Chưa có tài khoản Gari? <a href="/frontend2/register.html">Đăng ký tài khoản mới →</a>
            </div>
        </div>
    </div>

    <script>
        // Check if already authenticated
        (async function checkExistingAuth() {
            const token = localStorage.getItem('gari_token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const nextUrl = new URLSearchParams(window.location.search).get('redirect') || '/frontend2/index.html';
                        window.location.href = nextUrl;
                    }
                } catch(e) {}
            }
        })();

        // Dev autofill helper
        document.getElementById('btnDevAutofill').onclick = () => {
            document.getElementById('loginEmail').value = 'danhuynh@gari.vn';
            document.getElementById('loginPassword').value = 'Password123!';
            showAlert('Đã điền tài khoản Kỹ sư Đan Huỳnh.', 'success');
        };

        // Password visibility toggle
        const pwdInput = document.getElementById('loginPassword');
        const toggleBtn = document.getElementById('btnTogglePassword');
        toggleBtn.onclick = () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Ẩn';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Hiện';
            }
        };

        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('authAlert');
            alert.className = 'auth-alert ' + type;
            alert.textContent = msg;
            alert.style.display = 'flex';
        }

        // Handle Login Submission
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btnSubmit = document.getElementById('btnSubmit');

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Đang xác thực...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, remember_me: rememberMe })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.token) {
                        localStorage.setItem('gari_token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('gari_user', JSON.stringify(data.user));
                    }
                    showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
                    
                    const nextUrl = new URLSearchParams(window.location.search).get('redirect') || '/frontend2/index.html';
                    setTimeout(() => {
                        window.location.href = nextUrl;
                    }, 400);
                } else {
                    showAlert(data.detail || data.message || 'Email hoặc mật khẩu không chính xác.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Đăng nhập vào hệ thống';
                }
            } catch (err) {
                showAlert('Không thể kết nối với máy chủ. Vui lòng kiểm tra mạng hoặc thử lại sau.', 'error');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Đăng nhập vào hệ thống';
            }
        };
    </script>
</body>
</html>
