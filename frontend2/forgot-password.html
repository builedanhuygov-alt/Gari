<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu • Gari AI Lab</title>
    <link rel="stylesheet" href="/static/frontend2/style.css?v=20261104_stable">
    <script>
        try {
            var t = localStorage.getItem('gari-theme');
            if (t === 'dark') document.documentElement.dataset.theme = 'dark';
            else document.documentElement.dataset.theme = 'light';
        } catch(e) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 0%, rgba(22, 101, 52, 0.08) 0%, transparent 60%), var(--bg);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .auth-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #166534 0%, #15803D 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.3);
        }

        .auth-logo svg {
            width: 24px;
            height: 24px;
        }

        .auth-title {
            font-size: 21px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin: 0;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .auth-alert {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        .auth-alert.error {
            display: flex;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .auth-alert.success {
            display: flex;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .auth-alert.info {
            display: flex;
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .token-box {
            background: var(--surface-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 12px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .token-code {
            font-family: monospace;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
            color: var(--primary);
            font-weight: 700;
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="auth-title">Khôi phục mật khẩu</h1>
                    <p class="auth-subtitle">Nhập email tài khoản để đặt lại mật khẩu truy cập Gari</p>
                </div>
            </div>

            <!-- Error / Info Notification -->
            <div id="authAlert" class="auth-alert"></div>

            <!-- Step 1: Request Reset Token -->
            <form id="requestResetForm" style="display:flex; flex-direction:column; gap:16px;">
                <div class="form-group" style="margin:0;">
                    <label class="form-label" for="resetEmail">Email tài khoản *</label>
                    <input type="email" id="resetEmail" class="input" placeholder="email@example.com" required />
                    <span class="form-hint">Hệ thống sẽ kiểm tra và cấp mã xác thực 15 phút.</span>
                </div>

                <button type="submit" class="btn btn-primary" id="btnRequestSubmit" style="height:42px; font-size:14px; width:100%;">
                    Tạo mã xác thực khôi phục
                </button>
            </form>

            <!-- Step 2: Reset Password Form (Initially hidden) -->
            <form id="doResetForm" style="display:none; flex-direction:column; gap:14px;">
                <div class="token-box">
                    <strong>⚡ Chế độ cục bộ (Dev Environment):</strong>
                    <span>Dịch vụ SMTP chưa cấu hình. Mã xác thực 15 phút được tạo an toàn bên dưới:</span>
                    <div class="token-code" id="devTokenDisplay"></div>
                </div>

                <input type="hidden" id="resetTokenInput" />

                <div class="form-group" style="margin:0;">
                    <label class="form-label" for="newPassword">Mật khẩu mới *</label>
                    <input type="password" id="newPassword" class="input" placeholder="Tối thiểu 6 ký tự" required minlength="6" />
                </div>

                <div class="form-group" style="margin:0;">
                    <label class="form-label" for="confirmNewPassword">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmNewPassword" class="input" placeholder="Nhập lại mật khẩu mới" required minlength="6" />
                </div>

                <button type="submit" class="btn btn-primary" id="btnDoResetSubmit" style="height:42px; font-size:14px; width:100%;">
                    Lưu mật khẩu mới & Đăng nhập
                </button>
            </form>

            <div class="auth-footer">
                Đã nhớ mật khẩu? <a href="/frontend2/login.html">Quay lại Đăng nhập →</a>
            </div>
        </div>
    </div>

    <script type="module">
        import '/frontend2/firebase-client.js';

        // Pre-initialize auth
        if (window.gariAuth) {
            window.gariAuth.init().catch(() => {});
        }

        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('authAlert');
            alert.className = 'auth-alert ' + type;
            alert.textContent = msg;
            alert.style.display = 'flex';
        }

        // Step 1: Request Password Reset
        document.getElementById('requestResetForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('btnRequestSubmit');
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                if (window.gariAuth) {
                    await window.gariAuth.init();
                    if (window.gariAuth.isFirebaseReady) {
                        const result = await window.gariAuth.resetPassword(email);
                        showAlert(result.message || 'Đã gửi liên kết đặt lại mật khẩu đến email của bạn.', 'success');
                        btn.disabled = false;
                        btn.textContent = 'Gửi lại email xác thực';
                        return;
                    }
                }

                // Native backend fallback
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(data.message, 'info');
                    document.getElementById('requestResetForm').style.display = 'none';
                    document.getElementById('doResetForm').style.display = 'flex';
                    document.getElementById('resetTokenInput').value = data.reset_token;
                    document.getElementById('devTokenDisplay').textContent = data.reset_token;
                } else {
                    showAlert(data.detail || data.message || 'Không tìm thấy tài khoản với email này.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Tạo mã xác thực khôi phục';
                }
            } catch (err) {
                showAlert(err.message || 'Lỗi kết nối máy chủ. Vui lòng thử lại.', 'error');
                btn.disabled = false;
                btn.textContent = 'Tạo mã xác thực khôi phục';
            }
        };

        // Step 2: Set New Password (for native backend flow)
        document.getElementById('doResetForm').onsubmit = async (e) => {
            e.preventDefault();
            const token = document.getElementById('resetTokenInput').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const btn = document.getElementById('btnDoResetSubmit');

            if (newPassword !== confirmNewPassword) {
                showAlert('Mật khẩu mới và xác nhận mật khẩu không khớp.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang cập nhật mật khẩu...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        new_password: newPassword,
                        confirm_password: confirmNewPassword
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/frontend2/login.html';
                    }, 1200);
                } else {
                    showAlert(data.detail || data.message || 'Mã xác thực không hợp lệ hoặc đã hết hạn.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Lưu mật khẩu mới & Đăng nhập';
                }
            } catch (err) {
                showAlert('Lỗi kết nối máy chủ.', 'error');
                btn.disabled = false;
                btn.textContent = 'Lưu mật khẩu mới & Đăng nhập';
            }
        };
    </script>
</body>
</html>
