name: GARI — PostgreSQL 15 Supabase Integration Validation

# ==============================================================================
# GARI AgriTech AI Platform — Disposable PostgreSQL 15 CI Validation Workflow
# Target: Ephemeral PostgreSQL 15 Service Container
# Invariants:
# 1. Zero PHP.
# 2. Ephemeral container destroyed after run; test database dropped.
# 3. Strictly prohibited from connecting to GARI Production Supabase.
# 4. Strictly zero real user data (synthetic test fixtures only).
# 5. Local files prepared locally; execution requires user approval to commit/push.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Test Execution Profile'
        required: true
        default: 'ephemeral-postgres-15'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'supabase/**'
      - 'tests/test_postgres_live_validation.py'
      - 'tests/test_supabase_postgres_integration.py'
      - '.github/workflows/postgres-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-postgresql-15:
    name: PostgreSQL 15 Migration & RLS Engine Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gari_disposable_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup Python Runtime (3.11)
        uses: actions/setup-python@0b93645e9fb717ef0f17e8f819dd8826487ab549 # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Pre-Flight Production Isolation & Secret Leak Guard
        run: |
          echo "======================================================================"
          echo "           GARI PRE-FLIGHT POSTGRESQL ENVIRONMENT SECURITY AUDIT"
          echo "======================================================================"
          # Fail-closed if production Supabase URL or credentials exist in environment
          if env | grep -iE 'supabase\.co|sb_secret|gari_prod|service_role_key'; then
            echo "[FATAL] Production Supabase tokens or domains detected in CI environment!"
            exit 1
          fi

          echo "[PASS] Zero production credentials detected."
          echo "[PASS] Target is strictly localhost:5432 (ephemeral service container)."

      - name: 4. Install PostgreSQL Client & Driver Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: 5. Execute Real PostgreSQL 15 Validation Suite (Tier A)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test_password
          PGDATABASE: gari_disposable_test_db
        run: |
          echo "======================================================================"
          echo "          EXECUTING TIER A: REAL POSTGRESQL 15 ENGINE SUITE"
          echo "======================================================================"
          python -m unittest tests/test_postgres_live_validation.py -v

      - name: 6. Execute Python Relational Simulation Suite (Tier C)
        run: |
          echo "======================================================================"
          echo "        EXECUTING TIER C: PYTHON RELATIONAL SIMULATION SUITE"
          echo "======================================================================"
          python -m unittest tests/test_supabase_postgres_integration.py -v

      - name: 7. Post-Run Disposable Database Teardown
        if: always()
        run: |
          echo "======================================================================"
          echo "           TEARING DOWN DISPOSABLE TEST DATABASE"
          echo "======================================================================"
          python -c "
          import psycopg2
          try:
              conn = psycopg2.connect(
                  host='localhost',
                  port=5432,
                  user='postgres',
                  password='test_password',
                  dbname='postgres'
              )
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute('DROP DATABASE IF EXISTS gari_disposable_test_db WITH (FORCE);')
              conn.close()
              print('[CLEANUP] Disposable test database dropped successfully.')
          except Exception as e:
              print(f'[CLEANUP NOTICE] {e}')
          "
          echo "[CLEANUP] Ephemeral PostgreSQL container will be automatically purged by GitHub Actions."
