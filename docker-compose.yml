version: '3.8'

services:
  gari-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gari-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./database:/app/database
      - ./models:/app/models:ro
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=8000
      - DEVICE=cpu
      - MAX_CACHED_MODELS=3
      - INFERENCE_TIMEOUT_SECONDS=30
      - MODEL_IDLE_TIMEOUT_SECONDS=300
      - MODEL_PRELOAD_ENABLED=false
      - MODEL_AUTO_UNLOAD_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 12G
        reservations:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gari-network

  nginx:
    image: nginx:1.25-alpine
    container_name: gari-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/oracle/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - gari-backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - gari-network

networks:
  gari-network:
    driver: bridge
