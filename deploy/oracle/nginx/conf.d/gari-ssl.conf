# ==============================================================================
# GARI AgriTech AI Lab — Nginx Production SSL Configuration
# Path: deploy/oracle/nginx/conf.d/gari-ssl.conf
# Activated after Let's Encrypt certificates are generated by setup_ssl.sh
# ==============================================================================

upstream gari_api_backend {
    server gari-backend:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) — Certbot ACME Challenge & Permanent HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Certbot domain verification renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) — Production SSL Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/gari/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gari/privkey.pem;

    # SSL Protocol & Cipher Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload Size Limit (Leaf image uploads can be up to 25MB)
    client_max_body_size 25M;

    # Rate Limiting & Connection Limiting
    limit_req zone=api_limit burst=30 nodelay;
    limit_conn conn_limit 20;

    # Proxy to FastAPI Backend
    location / {
        proxy_pass http://gari_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Extended timeouts for PyTorch model loading
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Healthcheck bypass (lightweight, no rate limit)
    location /health {
        proxy_pass http://gari_api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Ready check bypass
    location /ready {
        proxy_pass http://gari_api_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

