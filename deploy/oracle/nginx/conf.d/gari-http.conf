# ==============================================================================
# GARI AgriTech AI Lab — Nginx HTTP-Only Configuration (Bootstrap Stage)
# Path: deploy/oracle/nginx/conf.d/gari-http.conf
# Used during initial VM bootstrap before Let's Encrypt certificates are issued
# ==============================================================================

upstream gari_api_backend {
    server gari-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Certbot ACME domain verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Proxy traffic to FastAPI backend before SSL setup
    location / {
        proxy_pass http://gari_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /health {
        proxy_pass http://gari_api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready {
        proxy_pass http://gari_api_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

