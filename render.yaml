services:
  - type: web
    name: gari-ai-lab-inference-api
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: GARI_PORT
        value: "8000"
      - key: DEVICE
        value: cpu
      - key: MAX_CACHED_MODELS
        value: "3"
