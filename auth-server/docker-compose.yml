version: '3.8'

services:
  gari-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gari-auth-service
    restart: unless-stopped
    environment:
      - AUTH_ENV=production
      - AUTH_HOST=0.0.0.0
      - AUTH_PORT=8001
      - AUTH_DATA_DIR=/var/lib/gari-auth/data
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=lax
      - MAX_REGISTRATION_ACCOUNTS=10
      - REGISTRATION_OPEN=true
      - BOOTSTRAP_ADMIN_TOKEN=${BOOTSTRAP_ADMIN_TOKEN:-}
    volumes:
      - ./data:/var/lib/gari-auth/data
      - ./backups:/var/lib/gari-auth/backups
    networks:
      - auth_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: gari-auth-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - auth_internal
    depends_on:
      - gari-auth

volumes:
  caddy_data:
  caddy_config:

networks:
  auth_internal:
    driver: bridge
